<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokerAI 1v1 单挑</title>
<style>
  :root { --felt:#1a5c3a; --felt-dark:#134429; --gold:#e8c15a; --card-bg:#fdfdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:16px; }
  h1 { font-size:1.1rem; color:var(--gold); display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .score { font-size:.9rem; color:#9da7b1; }
  .score b { color:#e6edf3; }

  .table { background:radial-gradient(ellipse at center, var(--felt), var(--felt-dark)); border:6px solid #3a2a1a; border-radius:120px; padding:22px 30px; min-height:300px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; box-shadow:0 8px 30px rgba(0,0,0,.5) inset; }
  .seat { text-align:center; }
  .seat .name { font-size:.85rem; color:#cdd6de; margin-bottom:6px; }
  .seat .name .tag { background:#2d333b; border-radius:8px; padding:1px 8px; margin-left:6px; font-size:.75rem; }
  .cards { display:flex; gap:6px; justify-content:center; min-height:64px; }
  .card { width:46px; height:64px; background:var(--card-bg); border-radius:6px; display:flex; flex-direction:column; justify-content:center; align-items:center; font-weight:700; font-size:1.25rem; color:#111; box-shadow:0 2px 5px rgba(0,0,0,.4); }
  .card.red { color:#c0392b; }
  .card.back { background:repeating-linear-gradient(45deg,#31456e,#31456e 6px,#26365a 6px,#26365a 12px); }
  .card small { font-size:.8rem; line-height:1; }
  .pot { color:var(--gold); font-weight:700; margin:8px 0; font-size:1.05rem; }
  .street { color:#9da7b1; font-size:.8rem; margin-bottom:4px; text-transform:uppercase; letter-spacing:2px; }

  .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0; min-height:44px; }
  button { background:#238636; color:#fff; border:0; border-radius:8px; padding:10px 20px; font-size:.95rem; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  button.danger { background:#a03030; }
  button.neutral { background:#30507a; }
  button.gold { background:#8a6d1f; }
  button:disabled { background:#30363d; color:#8b949e; cursor:default; }
  .raise-box { display:flex; align-items:center; gap:6px; }
  .raise-box input { width:86px; padding:9px; border-radius:8px; border:1px solid #444; background:#161b22; color:#fff; font-size:.95rem; }

  .panel { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:12px 14px; margin-top:12px; font-size:.85rem; }
  .panel h3 { font-size:.85rem; color:var(--gold); margin-bottom:8px; cursor:pointer; user-select:none; }
  .log { max-height:150px; overflow-y:auto; color:#9da7b1; line-height:1.6; font-family:Consolas,monospace; font-size:.8rem; }
  .insight .item { border-left:3px solid #30507a; padding:4px 8px; margin:6px 0; color:#b8c2cc; }
  .insight .item b { color:#e6edf3; }
  .result-banner { text-align:center; padding:10px; border-radius:8px; margin-top:10px; font-weight:700; }
  .win { background:#1c3a25; color:#5dd879; }
  .lose { background:#3a1c1c; color:#e88; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <span>🃏 PokerAI 1v1 单挑</span>
    <span class="score">已玩 <b id="hands">0</b> 手 · 你的盈亏 <b id="total">+0.0</b> BB (<b id="bb100">0</b> BB/100)
      <button class="neutral" style="padding:4px 10px;font-size:.8rem" onclick="resetSession()">重开</button>
    </span>
  </h1>

  <div class="table">
    <div class="seat">
      <div class="name">🤖 AI <span class="tag" id="ai-tag"></span></div>
      <div class="cards" id="ai-cards"></div>
    </div>
    <div style="text-align:center">
      <div class="street" id="street"></div>
      <div class="cards" id="board"></div>
      <div class="pot" id="pot"></div>
    </div>
    <div class="seat">
      <div class="cards" id="my-cards"></div>
      <div class="name" style="margin-top:6px">😎 你 <span class="tag" id="my-pos"></span> <span class="tag" id="my-stack"></span></div>
    </div>
  </div>

  <div id="result-banner" class="result-banner hidden"></div>

  <div class="actions" id="actions">
    <button class="gold" onclick="newHand()" id="btn-deal">发牌开始</button>
  </div>

  <div class="panel"><h3>本手记录</h3><div class="log" id="log"></div></div>

  <div class="panel insight">
    <h3 onclick="toggle('insight-body')">🧠 AI 决策透视（上一手，点击展开）</h3>
    <div id="insight-body" class="hidden"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastState = null;

function suitClass(c) { return (c.endsWith('h')||c.endsWith('d')) ? 'card red' : 'card'; }
function suitSym(s) { return {s:'♠',h:'♥',d:'♦',c:'♣'}[s]||s; }
function cardHtml(c) {
  if (!c) return '';
  const rank = c.slice(0,-1), suit = c.slice(-1);
  return `<div class="${suitClass(c)}">${rank}<small>${suitSym(suit)}</small></div>`;
}
function backCards(n) { return Array(n).fill('<div class="card back"></div>').join(''); }

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', body:JSON.stringify(body)} : undefined);
  return r.json();
}
async function newHand() { $('result-banner').classList.add('hidden'); await api('/api/new_hand', {}); poll(); }
async function resetSession() { await api('/api/reset', {}); $('insight-body').innerHTML=''; poll(); }
async function act(action, amount) {
  const r = await api('/api/action', {action, amount});
  if (!r.ok && r.error) alert(r.error);
  poll();
}
function toggle(id) { $(id).classList.toggle('hidden'); }

function render(s) {
  lastState = s;
  $('hands').textContent = s.session.hands_played;
  const t = s.session.human_total;
  $('total').textContent = (t>=0?'+':'') + t.toFixed(1);
  $('bb100').textContent = (s.session.bb100>=0?'+':'') + s.session.bb100;

  const actionsEl = $('actions');

  if (s.your_turn && s.table) {
    const g = s.table;
    $('street').textContent = g.street;
    $('board').innerHTML = g.board.map(cardHtml).join('');
    $('my-cards').innerHTML = g.your_cards.map(cardHtml).join('');
    $('ai-cards').innerHTML = backCards(2);
    $('pot').textContent = `底池 ${g.pot} BB`;
    $('my-pos').textContent = g.position;
    $('my-stack').textContent = g.your_stack + ' BB';
    $('log').innerHTML = g.log.join('<br>');

    let html = '';
    html += `<button class="danger" onclick="act('fold')">Fold</button>`;
    if (g.to_call > 0.01) {
      html += `<button class="neutral" onclick="act('call')">Call ${g.to_call}</button>`;
      html += `<div class="raise-box"><button onclick="act('raise', +$('raise-amt').value)">Raise to</button>
               <input id="raise-amt" type="number" step="0.5" value="${g.min_raise_to}"></div>`;
    } else {
      html += `<button class="neutral" onclick="act('check')">Check</button>`;
      const half = Math.max(1, Math.round(g.pot*0.5*2)/2), full = Math.max(1, Math.round(g.pot*2)/2);
      html += `<button onclick="act('bet', ${half})">Bet ½池 (${half})</button>`;
      html += `<button onclick="act('bet', ${full})">Bet 满池 (${full})</button>`;
      html += `<div class="raise-box"><button onclick="act('bet', +$('bet-amt').value)">Bet</button>
               <input id="bet-amt" type="number" step="0.5" value="${half}"></div>`;
    }
    html += `<button class="gold" onclick="act('allin')">All-in</button>`;
    actionsEl.innerHTML = html;

  } else if (s.hand_active) {
    actionsEl.innerHTML = '<button disabled>AI 思考中…</button>';

  } else {
    actionsEl.innerHTML = '<button class="gold" onclick="newHand()">发下一手</button>';
    const r = s.last_hand;
    if (r) {
      $('street').textContent = '';
      $('board').innerHTML = (r.board||[]).map(cardHtml).join('');
      $('my-cards').innerHTML = (r.your_cards||[]).map(cardHtml).join('');
      $('ai-cards').innerHTML = r.ai_cards ? r.ai_cards.map(cardHtml).join('') : backCards(2);
      $('pot').textContent = `底池 ${r.pot} BB`;
      $('log').innerHTML = (r.log||[]).join('<br>');

      const win = r.your_profit >= 0;
      const b = $('result-banner');
      b.textContent = `第${r.hand_num}手 · ${win?'你赢了':'你输了'} ${Math.abs(r.your_profit).toFixed(1)} BB` +
        (r.showdown ? `（摊牌: 你 ${r.hand_strengths[0]} vs AI ${r.hand_strengths[1]}）` : '');
      b.className = 'result-banner ' + (win?'win':'lose');
      b.classList.remove('hidden');

      const ins = r.ai_insight;
      if (ins) {
        $('ai-tag').textContent = `它眼中的你: ${ins.you_classified_as}` +
          (ins.your_vpip!=null ? ` (VPIP ${(ins.your_vpip*100).toFixed(0)}% AF ${ins.your_af})` : '');
        $('insight-body').innerHTML = ins.ai_reasoning.map(x =>
          `<div class="item"><b>[${x.street}] ${x.action}</b> — GTO分布 ${JSON.stringify(x.gto)}<br>${x.reasoning}` +
          (x.exploit ? `<br><i>exploit: ${x.exploit}</i>` : '') + `</div>`).join('') || '（本手AI没有决策记录）';
      }
    }
  }
}

async function poll() {
  try { render(await api('/api/state')); } catch(e) {}
}
setInterval(poll, 700);
poll();
</script>
</body>
</html>
